<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60">
  <!-- Interface - Full Logo with Text - Black & White -->

  <!-- Icon -->
  <g transform="translate(5, 5)">
    <!-- Main circle -->
    <circle cx="25" cy="25" r="23" fill="none" stroke="currentColor" stroke-width="2"/>

    <!-- Person icon -->
    <circle cx="17" cy="17" r="5" fill="currentColor"/>
    <path d="M 9 32 Q 9 23 17 23 Q 25 23 25 32 L 25 34 L 9 34 Z" fill="currentColor"/>

    <!-- Chart bars -->
    <rect x="29" y="27" width="5" height="12" rx="1" fill="currentColor"/>
    <rect x="36" y="21" width="5" height="18" rx="1" fill="currentColor"/>

    <!-- Trend line -->
    <path d="M 29 30 L 36 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="36" cy="24" r="2" fill="currentColor"/>
  </g>

  <!-- Text -->
  <text x="65" y="38" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="currentColor">
    interface
  </text>
</svg>
