<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Interface Logo - Black & White -->

  <!-- Main circle background -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3"/>

  <!-- Stylized person icon (representing HR) -->
  <circle cx="35" cy="32" r="8" fill="currentColor"/>
  <path d="M 22 55 Q 22 42 35 42 Q 48 42 48 55 L 48 58 L 22 58 Z" fill="currentColor"/>

  <!-- Analytics chart bars -->
  <rect x="55" y="50" width="8" height="20" rx="2" fill="currentColor"/>
  <rect x="66" y="40" width="8" height="30" rx="2" fill="currentColor"/>
  <rect x="77" y="30" width="8" height="40" rx="2" fill="currentColor"/>

  <!-- Connecting line representing data flow -->
  <path d="M 48 50 L 55 50" stroke="currentColor" stroke-width="2" stroke-dasharray="2,2"/>

  <!-- Trend line over bars -->
  <path d="M 55 55 L 66 45 L 77 35" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="77" cy="35" r="3" fill="currentColor"/>
</svg>
