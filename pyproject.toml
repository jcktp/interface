[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "interface"
version = "0.1.0"
description = "A small, local-first HR directory with an API and optional MCP adapter"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
mcp = ["mcp>=1.12,<2", "httpx>=0.27,<1"]

[project.scripts]
interface = "interface_core.cli:main"
interface-mcp = "interface_core.mcp_server:main"

[tool.setuptools.package-data]
interface_core = ["static/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
